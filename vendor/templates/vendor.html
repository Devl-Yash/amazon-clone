{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vendor</title>
    <link rel="stylesheet" href="{% static 'vendor.css' %}">
</head>
<body>
   
    <div class="main">
        <header>
            <div class="logo">
                <img height="90" src="{% static 'amazon.webp' %}" alt="">
            </div>
            <div class="btn">
                <div class="home">
                    <a href="{% url 'default' %}" class="a">Home</a>
                </div>
                
                <div class="admin">
                    <a href=""  class="a">Admin</a>
                </div>
            </div>
        </header>
    </div>

    <div class="body">
        <form action="" method="post" enctype="multipart/form-data">
            {% csrf_token %}    
            {{ form.as_p }}
            <a href="">
                
                <button> Add Product </button>
            </a>
        </form>
    </div>

    
</body>
</html>
